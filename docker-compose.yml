services:
  webapp:
    image: php:7.4-apache
    ports:
      - "8080:80"
    environment:
      - API_ENDPOINT=http://api:5000
    command: >
      bash -c "echo '<?php
      $url = $_GET[\"url\"] ?? \"http://example.com\";
      $api = \"http://api:5000/?url=\" . urlencode($url);
      echo \"<h1>Link Extractor PHP Front-end</h1>\";
      echo \"<p>A extrair links de: \" . htmlspecialchars($url) . \"</p>\";
      echo \"<pre>\" . file_get_contents($api) . \"</pre>\";
      ?>' > /var/www/html/index.php && apache2-foreground"
    depends_on:
      - api
    networks:
      - net

  api:
    image: python:3.9-slim
    command: >
      bash -c "pip install flask redis requests beautifulsoup4 && python -c '
      import redis, requests
      from flask import Flask, request, jsonify
      from bs4 import BeautifulSoup
      app = Flask(__name__)
      r = redis.Redis(host=\"redis\", port=6379)
      @app.route(\"/\", methods=[\"GET\"])
      def extract():
          url = request.args.get(\"url\")
          if not url: return jsonify({\"error\": \"URL missing\"}), 400
          cached = r.get(url)
          if cached: return cached.decode(\"utf-8\")
          try:
              resp = requests.get(url, timeout=5)
              soup = BeautifulSoup(resp.text, \"html.parser\")
              links = [a.get(\"href\") for a in soup.find_all(\"href\") if a.get(\"href\")]
              r.set(url, str(links))
              return jsonify(links)
          except Exception as e:
              return jsonify({\"error\": str(e)}), 500
      app.run(host=\"0.0.0.0\", port=5000)
      '"
    environment:
      - CACHE_HOST=redis
    depends_on:
      - redis
    networks:
      - net

  redis:
    image: redis:alpine
    networks:
      - net

networks:
  net: